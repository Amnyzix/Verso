name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android folder if missing
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build Release APK
        working-directory: ./android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK to verso.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk verso.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verso-apk
          path: verso.apk

      - name: Update "Latest Build" Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Verso — Latest APK"
          body: "Automated build from commit ${{ github.sha }}"
          prerelease: false
          files: verso.apk